<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contáctanos para iniciar tu proyecto con Taruma Arquitectos.">
  <meta name="author" content="Taruma Arquitectos">
  <title>Contacto | Taruma Arquitectos</title>
  <link rel="icon" type="image/png" href="/assets/images/brand/taruma-logo.png">
  <link rel="stylesheet" href="/css/servicios.css">
</head>
<body>

  <!-- Header común (partials/header.html, cargado por js/layout.js) -->
  <div id="site-header"></div>

  <section class="about-section page-start" id="contacto" style="background: rgba(14, 21, 30, 0.4);">
    <div class="container">
      <div class="section-header">
        <span class="section-badge">Comencemos tu Proyecto</span>
        <h2 class="section-title">Contáctanos</h2>
        <p class="section-description">
          Estamos listos para materializar tu visión. Envíanos un mensaje o agenda una sesión de asesoría arquitectónica con nuestro equipo.
        </p>
      </div>

      <div style="max-width: 640px; margin: 0 auto;">
        <form id="contactForm" style="background: var(--bg-card); padding: 36px; border-radius: var(--radius-md); border: 1px solid var(--border-card);">
          <div class="form-group">
            <label class="form-label" for="contactName">Nombre Completo</label>
            <input type="text" id="contactName" class="form-input" required placeholder="Tu nombre y apellido">
          </div>
          <div class="form-group">
            <label class="form-label" for="contactEmail">Correo Electrónico</label>
            <input type="email" id="contactEmail" class="form-input" required placeholder="ejemplo@correo.com">
          </div>
          <div class="form-group">
            <label class="form-label" for="contactPhone">Teléfono / WhatsApp</label>
            <input type="tel" id="contactPhone" class="form-input" placeholder="+504 9999-9999">
          </div>
          <div class="form-group">
            <label class="form-label" for="contactMsg">Mensaje o Consulta</label>
            <textarea id="contactMsg" class="form-textarea" required placeholder="Cuéntanos sobre tu idea, presupuesto aproximado o fechas estimadas..."></textarea>
          </div>
          <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
            <span>Enviar Consulta</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer común (partials/footer.html, cargado por js/layout.js) -->
  <div id="site-footer"></div>

  <script src="/js/layout.js"></script>

</body>
</html>
